name: Build candidate firmware
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TZ: Asia/Shanghai
      BUILD_SOURCE: ${{ github.workspace }}/build/openwrt
      BUILD_LOGS: ${{ github.workspace }}/artifacts/logs
      FIRMWARE_OUTPUT: ${{ github.workspace }}/artifacts/firmware
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
      - name: Validate lock and tests
        run: |
          python3 scripts/project.py validate
          python3 -m unittest discover -s tests -v
      - name: Check runner resources
        run: |
          df -h
          free -h
          python3 - <<'PY'
          import json, os, shutil
          lock=json.load(open('configs/build-lock.json'))
          free=shutil.disk_usage('.').free/1024**3
          memory=os.sysconf('SC_PHYS_PAGES')*os.sysconf('SC_PAGE_SIZE')/1024**3
          if free < lock['minimum_build_free_gib'] or memory < lock['minimum_build_memory_gib']:
              raise SystemExit(f'Insufficient resources: free={free:.1f}GiB RAM={memory:.1f}GiB. Use a larger Linux runner; no host files are deleted.')
          PY
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl ca-certificates time cpio xz-utils zstd libelf-dev llvm
      - name: Build pinned candidate
        run: bash scripts/build.sh
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate firmware
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: firmware-candidate-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/firmware/
          if-no-files-found: error
          retention-days: 30
      - name: Upload matching offline packages and build tools
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, pinned
        with:
          name: expansion-kit-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/expansion/
          if-no-files-found: error
          retention-days: 14
